name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish PlantClusterFinder
    needs: []
    runs-on: ubuntu-latest
    environment: actions-bulid-and-deploy
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up UV
      uses: astral-sh/setup-uv@16592cddee295b60b48cf3202a6dbe45c6f479f9
      with:
        enable-cache: true
    - name: Install dependencies and build tools
      run: |
        uv sync
        uv tool install hatch --with hatch-conda-build
        uv tool install anaconda-client
    - name: Build artifacts for PyPI
      run: uv build
    - name: Publish Package to PyPI using OIDC
      uses: pypa/gh-action-pypi-publish@release/v1
    - name: Attach assets to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: false
