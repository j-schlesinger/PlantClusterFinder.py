name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rye
      uses: eifinger/setup-rye@v2
      with:
        enable-cache: true
        cache-prefix: ${{ matrix.python-version }}
    - name: Pin python-version ${{ matrix.python-version }}
      if: steps.setup-rye.outputs.cache-hit != 'true'
      run: rye pin ${{ matrix.python-version }}
    - name: Install dependencies
      if: steps.setup-rye.outputs.cache-hit != 'true'
      run: |
        rye sync --no-lock
    - name: Analysing the code with black, isort, mypy and flake8
      uses: ricardochaves/python-lint@v1.4.0
      with:
        python-root-list: "src test"
        use-pylint: false
        use-pycodestyle: false
        use-flake8: false
        use-black: false
        use-mypy: false
        use-isort: true
        extra-pylint-options: ""
        extra-pycodestyle-options: ""
        extra-flake8-options: ""
        extra-black-options: ""
        extra-mypy-options: ""
        extra-isort-options: ""
    - name: Performing linting with ruff and tests using pytest
      run: |
        rye lint
        rye run mypy src test
        rye run isort --check src test
        rye fmt --check
        rye run pytest
