name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up UV
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      run: |
        uv sync --no-lock
    - name: Install Blast and MCT
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: ncbi-blast+ mcl
        version: 1.0
    - name: Performing linting with ruff and tests using pytest
      run: |
        uv --version
        echo "start mypy"
        uv run mypy --version
        uv run mypy src test
        echo "start isort"
        uv run isort --version
        uv run isort --profile black --filter-files --check src test || uv run isort --profile-black --filter-files --check src test -v
        echo "start fmt"
        uv run ruff -V
        uv run ruff check
        uv run ruff --check -q || uv run ruff --check -- --diff
        echo "start pytest"
        uv run pytest
