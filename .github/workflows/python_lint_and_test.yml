name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up UV
      uses: astral-sh/setup-uv@16592cddee295b60b48cf3202a6dbe45c6f479f9
    - name: Install dependencies
      run: |
        uv sync
    - name: Install Blast, MCT, and Diamond
      uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05
      with:
        packages: ncbi-blast+ mcl diamond-aligner
        version: 1.0
    - name: Performing linting with ruff and tests using pytest
      run: |
        uv --version
        echo "start mypy"
        uv run mypy --version
        uv run mypy --follow-untyped-imports src tests
        echo "start isort"
        uv run isort --version
        uv run isort --profile black --filter-files --check src tests || uv run isort --profile black --filter-files --check src tests -v
        echo "start fmt"
        uv run ruff -V
        uv run ruff check
        uv run ruff check -q || uv run ruff check --diff
        echo "start pytest"
        uv run pytest
