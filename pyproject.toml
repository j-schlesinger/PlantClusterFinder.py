[project]
name = "plantclusterfinder-py"
version = "2.0.0"
description = "Tool to find biosynthetic gene clusters in plants."
authors = [
    { name = "Jason Schlesinger", email = "jschlesi@nig.ac.jp" }
]
dependencies = [
    "pydantic>=2.6.3",
    "polars==1.26.0",
    "pyarrow>=17.0.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[project.scripts]
hello = "plantclusterfinder_py:hello"
plantclusterfinder = "plantclusterfinder_py:main.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
[dependency-groups]
dev = [
    "sphinx>=7.2.6",
    "pdoc>=14.4.0",
    "pytest>=8.0.1",
    "pre-commit>=3.6.2",
    "isort==5.13.2",
    "black>=24.2.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "uv>=0.6.10",
    "pandas>=2.2.2",
    "pyright>=1.1.404",
    "viztracer>=1.1.1",
    "wily>=1.25.0",
    "refurb>=2.2.0",
    "radon>=5.1",
    "pytest-pyright>=0.0.6",
]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "csubellipsoidea",
    "Inputs",
    "Expected_results_for_csubellipsoidea",
    ".venv",
    ".pytest_cache"
]


[tool.hatch.metadata]
allow-direct-references = true

[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["src/plantclusterfinder_py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# typeCheckingMode = "basic" # Prevents it from being too noisy

[tool.pytest.ini_options]
addopts = "--pyright-dir=src"
