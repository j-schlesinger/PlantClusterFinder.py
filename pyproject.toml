[project]
name = "plantclusterfinder-py"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "jschlesi", email = "jschlesi@nig.ac.jp" }
]
dependencies = [
    "scipy>=1.12.0",
    "pythoncyc>=2.0.2",
    "pydantic>=2.6.3",
    "polars>=0.20.13",
]
readme = "README.md"
requires-python = ">= 3.12"

[project.scripts]
hello = "plantclusterfinder_py:hello"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "sphinx>=7.2.6",
    "pdoc>=14.4.0",
    "pytest>=8.0.1",
    "pre-commit>=3.6.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/plantclusterfinder_py"]
