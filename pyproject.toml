[project]
name = "plantclusterfinder_py"
version = "2.0.0b"
description = "Tool to find biosynthetic gene clusters in plants."
authors = [
  { name = "Jason Schlesinger", email = "jschlesi@nig.ac.jp" },
  { name = "Mainak Dutta" },
]
dependencies = [
  "pydantic>=2.6.3",
  "polars<2.0",
  "pyarrow>=17.0.0",
  "biopython>=1.86",
  "bcbio-gff>=0.7.1",
  "numpy>=2.2.4",
  "gffutils>=0.13",
  "pluggy>=1.6.0",
  "requests>=2.32.5",
  "matplotlib>=3.11.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.scripts]
plantclusterfinder = "plantclusterfinder_py:main.main"
get_positions_of_gap = "plantclusterfinder_py:get_positions_of_gap.main"
test_plugins = "plantclusterfinder_py.plugin_arch:plugin_main.main"

[build-system]
requires = ["hatchling", "hatch-conda-build"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.hatch.build.targets.conda]
channels = ["bioconda"]
requirements.run = ["diamond", "mcl"]
test.commands = [
  "plantclusterfinder --help",
  "diamond --version",
  "mcl --version",
]

[dependency-groups]
dev = [
  "sphinx>=7.2.6",
  "pdoc>=14.4.0",
  "pytest>=8.0.1",
  "pre-commit>=3.6.2",
  "isort==5.13.2",
  "black>=24.2.0",
  "flake8>=7.0.0",
  "mypy>=1.19.1",
  "ruff>=0.15.5",
  "uv>=0.6.10",
  "pandas>=2.2.2",
  "pyright>=1.1.404",
  "viztracer>=1.1.1",
  "wily>=1.25.0",
  "radon>=5.1",
  "pytest-pyright>=0.0.6",
  "pytest-cov>=7.0.0",
  "py-spy>=0.4.1",
  "gff3tool>=2.1.0",
  "pyperf>=2.10.0",
  "psutil>=7.2.2",
  "pytest-codspeed>=4.4.0",
  "types-requests>=2.33.0.20260408",
]
docs = ["mkdocs>=1.6.1", "mkdocs-autoapi>=0.4.1", "mkdocstrings[python]>=1.0.4"]

[tool.ruff]
exclude = [
  ".git",
  "__pycache__",
  "csubellipsoidea",
  "Inputs",
  "Expected_results_for_csubellipsoidea",
  ".venv",
  ".pytest_cache",
  "*.ipynb",
]
line-length = 101

[tool.ruff.lint]
select = [
  "A",
  "E",
  "W",   # pycodestyle
  "I",   # isort
  "N",   # Naming
  "C4",  # comprehensions linting
  "UP",  # pyupgrade - stop doing things the old way
  "B",   # bugbear - auto-catch common bugs
  "S",   # bandit - security testing (not necessary here, but good idea)
  "PT",  # pytest style
  "RET", # return - prevent unpredictable returns
  "SIM", # simplify - when there's an easier way
  "PTH", # enforce the use of pathlib over os.path
  #"DOC",
  "D",   # docstring style enforcement
  "FIX",
  "TD",  # check todo statements
]

ignore = [
  "S101", # assert, needed for pytest
  "S603", # subprocess calls, used to call blast, etc.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.metadata]
allow-direct-references = true

[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["src/plantclusterfinder_py"]

[[tool.mypy.overrides]]
module = ["gffutils.*", "BCBio.GFF.*"]
follow_untyped_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
# typeCheckingMode = "basic" # Prevents it from being too noisy

[tool.pytest.ini_options]
addopts = "--pyright-dir=src --cov=src"
testpaths = ["tests"]

[tool.coverage.run]
# This section configures the underlying coverage.py engine
source = ["src"]
branch = true

[tool.coverage.report]
# Fail the build if total coverage is below this percentage
fail_under = 75
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
